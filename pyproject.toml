[project]
name = "gurrt"
version = "2.0.0"
description = "An Intelligent Open Source Video Understanding System A different path from traditional Large Video Language Models (LVLMs). Built for modularity, openness, and real world usability."
authors = [
    {name="Mohammad Owais", email = "owaismohammad2515@gmail.com"},
    {name= "Fareha Aslam", email = "farehaaslam57@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
classifiers = [
    "Programming Language :: Python :: 3.12"
]
dependencies = [
    "transformers>=5.1.0",
    "accelerate>=1.12.0",
    "pillow>=12.1.0",
    "chromadb>=1.4.1",
    "ollama>=0.6.1",
    "langchain>=1.2.9",
    "langchain-groq>=1.1.2",
    "sentence-transformers>=5.2.2",
    "tqdm>=4.67.3",
    "faster-whisper>=1.2.1",
    "langchain-text-splitters>=1.1.0",
    "pydantic>=2.12.5",
    "supermemory>=3.24.0",
    "platformdirs>=4.5.1",
    "typer>=0.21.1",
    "opencv-python-headless>=4.13.0.92",
    "imageio-ffmpeg>=0.6.0",
    "aiohttp>=3.14.1",
    "num2words>=0.5.14",
    "prompt_toolkit>=3.0.0",
    "opencv-python>=5.0.0.93",
    "pandas>=3.0.5",
    "gdown>=6.1.0",
]

[project.urls]
Homepage = "https://github.com/owaismohammad/gurrt"
Repository = "https://github.com/owaismohammad/gurrt"

[project.optional-dependencies]
server = ["fastapi>=0.128.7"]
cuda = [
    "torch",
    "torchvision",
    "torchaudio",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }


[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "build>=1.4.0",
    "twine>=6.2.0",
]

[project.scripts]
gurrt = "gurrt.cli.main:app"
